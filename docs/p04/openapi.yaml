openapi: 3.0.3
info:
  title: PR09 Monitoreo de huerto o ambiente - API REST
  version: 0.5.0
  description: |
    Contrato de la API Web 3.0 del equipo DSW-E01 (PR09). Se escribio a mano antes que el codigo (P04) y
    se completo en P05. Cliente: Angular 16. Servidor: Spring Boot 2.7 con Java 11. Base: PostgreSQL 16
    (mismo modelo de P02/P03, mas dos columnas de atencion en alerta desde P05).

    Cambios de 0.4.0 a 0.5.0 (P05):
    - Se implementan /api/zonas, /api/alertas y /api/anotaciones, que en 0.4.0 estaban solo en el contrato.
    - Cambio de estado: PATCH /api/alertas/{id} marca una alerta como atendida o la reabre (solo RESPONSABLE).
    - Alerta lleva variable, atendidaEn y atendidaPor.
    - GET /api/anotaciones ahora es paginado (PaginaAnotaciones), igual que lecturas y alertas; en 0.4.0 era una lista.
    - POST /api/anotaciones responde Location y valida que la lectura referida pertenezca a la zona (422).
    - Se agregan GET /api/alertas/{id} y GET /api/anotaciones/{id}.

    Todos los datos son ficticios.
servers:
  - url: http://localhost:8081
    description: Backend local de desarrollo
tags:
  - name: salud
  - name: acceso
  - name: catalogos
  - name: lecturas
  - name: alertas
  - name: anotaciones

paths:
  /api/health:
    get:
      tags: [salud]
      summary: Estado de la API y de su conexion a PostgreSQL
      operationId: salud
      security: []
      responses:
        '200':
          description: La API conecta a PostgreSQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
              example: { app: "huerto-api PR09 (P04 Spring Boot)", status: UP, db: UP, postgres: "PostgreSQL 16.15", lecturas: 7 }
        '503':
          description: PostgreSQL no responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /api/auth/login:
    post:
      tags: [acceso]
      summary: Cambia usuario y contrasena por un token con el rol
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciales' }
            example: { usuario: observador, contrasena: "<contrasena de laboratorio>" }
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401':
          description: Usuario o contrasena incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: NO_AUTENTICADO, mensaje: "Usuario o contrasena incorrectos." }

  /api/zonas:
    get:
      tags: [catalogos]
      summary: Zonas del huerto ordenadas por nombre (RF01)
      operationId: listarZonas
      responses:
        '200':
          description: Lista de zonas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zona' }
              example:
                - { id: 1, nombre: "Cama A", cultivo: "Jitomate", ubicacion: "Huerto escolar demo - patio norte (ficticio)" }
                - { id: 2, nombre: "Invernadero 1", cultivo: "Lechuga", ubicacion: "Huerto escolar demo - invernadero (ficticio)" }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/sensores:
    get:
      tags: [catalogos]
      summary: Sensores con zona, variable, rango fisico y umbral (RF01, RF02, RF04)
      operationId: listarSensores
      parameters:
        - { name: zonaId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: activo, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Lista de sensores ordenada por zona y codigo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sensor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/lecturas:
    get:
      tags: [lecturas]
      summary: Historial de lecturas, de la mas reciente a la mas antigua (RF05)
      operationId: listarLecturas
      parameters:
        - { name: sensorId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: zonaId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: origen, in: query, required: false, schema: { type: string, enum: [manual, simulado] } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Pagina de lecturas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaLecturas' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [lecturas]
      summary: Registra una lectura manual; si sale del umbral genera la alerta en la misma transaccion (RF03, RF06)
      description: Solo el rol OBSERVADOR. La procedencia no se envia; una captura por API siempre es "manual".
      operationId: registrarLectura
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaLectura' }
            examples:
              enRango: { summary: Valida sin alerta, value: { sensorId: 2, valor: 25.5, observacion: "Revision de la manana" } }
              fueraDeUmbral: { summary: Valida con alerta ALTA, value: { sensorId: 2, valor: 38 } }
      responses:
        '201':
          description: Lectura creada
          headers:
            Location:
              description: Ruta del recurso creado
              schema: { type: string, example: /api/lecturas/12 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lectura' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolSinPermiso' }
        '404':
          description: El sensor indicado no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: NO_ENCONTRADO, mensaje: "El sensor 999 no existe." }
        '409':
          description: El sensor existe pero esta inactivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: CONFLICTO, mensaje: "El sensor SEN-A-TEMP-01 esta inactivo; no admite lecturas." }
        '422':
          description: El valor es numerico pero fisicamente imposible para la variable; no se guarda nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: REGLA_DE_NEGOCIO, mensaje: "El valor 150 C esta fuera del rango fisico de Temperatura ambiente [-10.00, 60.00]." }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }

  /api/lecturas/{id}:
    get:
      tags: [lecturas]
      summary: Una lectura por su identificador
      operationId: lecturaPorId
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Lectura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lectura' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: No existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/alertas:
    get:
      tags: [alertas]
      summary: Alertas generadas por lecturas fuera de umbral, de la mas reciente a la mas antigua (RF06)
      operationId: listarAlertas
      parameters:
        - { name: nivel, in: query, required: false, schema: { type: string, enum: [BAJA, ALTA] } }
        - { name: atendida, in: query, required: false, schema: { type: boolean }, description: "true: solo atendidas; false: solo pendientes" }
        - { name: zonaId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Pagina de alertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAlertas' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /api/alertas/{id}:
    get:
      tags: [alertas]
      summary: Una alerta por su identificador
      operationId: alertaPorId
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Alerta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: No existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: NO_ENCONTRADO, mensaje: "La alerta 999 no existe." }
    patch:
      tags: [alertas]
      summary: Cambio de estado de la alerta. atendida=true la marca como atendida; atendida=false la reabre (RF06)
      description: |
        Solo el rol RESPONSABLE (en el acta es quien "anota decisiones" sobre el huerto). El servidor registra
        el instante y el rol que atendio; ninguno de los dos viaja en el cuerpo. Repetir el mismo estado responde 409.
      operationId: cambiarAtencionAlerta
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioAtencion' }
            examples:
              atender: { summary: Marcar como atendida, value: { atendida: true } }
              reabrir: { summary: Volver a pendiente, value: { atendida: false } }
      responses:
        '200':
          description: La alerta con su nuevo estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolSinPermiso' }
        '404':
          description: La alerta no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: La alerta ya estaba en el estado pedido; no se cambio nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: CONFLICTO, mensaje: "La alerta 7 ya estaba atendida." }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }

  /api/anotaciones:
    get:
      tags: [anotaciones]
      summary: Anotaciones de la mas reciente a la mas antigua, opcionalmente por zona (RF06)
      operationId: listarAnotaciones
      parameters:
        - { name: zonaId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: tamano, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: Pagina de anotaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAnotaciones' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [anotaciones]
      summary: Registra una anotacion firmada con el rol del token (RF06)
      description: |
        Los tres roles pueden anotar. El rol no se envia en el cuerpo; se toma del token. El texto se recorta
        (trim) antes de validar su largo: de 3 a 300 caracteres. Si se indica lecturaId, la lectura debe existir
        y pertenecer a un sensor de la zona indicada.
      operationId: registrarAnotacion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaAnotacion' }
            examples:
              deZona: { summary: Solo zona, value: { zonaId: 1, texto: "Riego manual por la tarde; suelo seco en la orilla norte." } }
              sobreLectura: { summary: Sobre una lectura, value: { zonaId: 1, lecturaId: 12, texto: "Se revisa el sensor; la lectura alta coincide con sol directo." } }
      responses:
        '201':
          description: Anotacion creada
          headers:
            Location:
              description: Ruta del recurso creado
              schema: { type: string, example: /api/anotaciones/5 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anotacion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: La zona o la lectura referida no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: NO_ENCONTRADO, mensaje: "La zona 999 no existe." }
        '422':
          description: La lectura existe pero no pertenece a la zona indicada; no se guarda nada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { codigo: REGLA_DE_NEGOCIO, mensaje: "La lectura 12 pertenece a Cama A, no a Invernadero 1." }
        '503': { $ref: '#/components/responses/BaseNoDisponible' }

  /api/anotaciones/{id}:
    get:
      tags: [anotaciones]
      summary: Una anotacion por su identificador
      operationId: anotacionPorId
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Anotacion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anotacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: No existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

security:
  - tokenPortador: []

components:
  securitySchemes:
    tokenPortador:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token HS256 emitido por /api/auth/login; lleva usuario, rol y caducidad (30 minutos).

  responses:
    Validacion:
      description: La peticion tiene datos invalidos (faltantes, tipo incorrecto, mas de dos decimales, texto demasiado corto o largo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            codigo: VALIDACION
            mensaje: "La peticion tiene datos invalidos; no se guardo nada."
            errores: [ { campo: valor, mensaje: "El valor admite como maximo 2 decimales; no se redondea." } ]
    NoAutenticado:
      description: Falta el token, es invalido o ya caduco
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { codigo: NO_AUTENTICADO, mensaje: "Falta el token, es invalido o ya caduco. Inicia sesion de nuevo." }
    RolSinPermiso:
      description: El rol del token no tiene permiso para la operacion
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { codigo: ROL_SIN_PERMISO, mensaje: "El rol COORDINACION no tiene permiso para esta operacion." }
    BaseNoDisponible:
      description: PostgreSQL no responde; no se guardo nada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Salud:
      type: object
      required: [app, status, db]
      properties:
        app: { type: string }
        status: { type: string, enum: [UP, DOWN] }
        db: { type: string, enum: [UP, DOWN] }
        postgres: { type: string }
        lecturas: { type: integer, format: int64 }
        error: { type: string }

    Credenciales:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario: { type: string, minLength: 1, maxLength: 40 }
        contrasena: { type: string, minLength: 1, maxLength: 100, format: password }

    Sesion:
      type: object
      required: [token, tipo, usuario, rol, expiraEn]
      properties:
        token: { type: string }
        tipo: { type: string, enum: [Bearer] }
        usuario: { type: string }
        rol: { $ref: '#/components/schemas/Rol' }
        expiraEn: { type: string, format: date-time }

    Rol:
      type: string
      enum: [RESPONSABLE, OBSERVADOR, COORDINACION]

    Zona:
      type: object
      required: [id, nombre, ubicacion]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, maxLength: 80 }
        cultivo: { type: string, maxLength: 80 }
        ubicacion: { type: string, maxLength: 120 }

    Sensor:
      type: object
      required: [id, codigo, activo, zonaId, zona, variable, unidad, rangoFisicoMinimo, rangoFisicoMaximo]
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string, maxLength: 20, example: SEN-A-TEMP-01 }
        activo: { type: boolean }
        zonaId: { type: integer, format: int64 }
        zona: { type: string }
        variable: { type: string, example: Temperatura ambiente }
        unidad: { type: string, example: C }
        rangoFisicoMinimo: { type: number, example: -10.00 }
        rangoFisicoMaximo: { type: number, example: 60.00 }
        umbralMinimo: { type: number, example: 15.00, description: Ausente si el sensor no tiene umbral }
        umbralMaximo: { type: number, example: 32.00 }

    NuevaLectura:
      type: object
      required: [sensorId, valor]
      properties:
        sensorId: { type: integer, format: int64, minimum: 1 }
        valor:
          type: number
          multipleOf: 0.01
          description: Maximo dos decimales. La API no redondea; 24.555 se rechaza con 400.
        observacion: { type: string, maxLength: 200 }

    AlertaResumen:
      type: object
      required: [nivel, mensaje]
      properties:
        nivel: { type: string, enum: [BAJA, ALTA] }
        mensaje: { type: string, maxLength: 200 }

    Lectura:
      type: object
      required: [id, sensorId, sensorCodigo, variable, zona, valor, unidad, origen, registradoEn]
      properties:
        id: { type: integer, format: int64 }
        sensorId: { type: integer, format: int64 }
        sensorCodigo: { type: string }
        variable: { type: string }
        zona: { type: string }
        valor: { type: number }
        unidad: { type: string }
        origen: { type: string, enum: [manual, simulado], description: Procedencia de la lectura }
        observacion: { type: string, maxLength: 200 }
        registradoEn: { type: string, format: date-time }
        alerta:
          allOf: [ { $ref: '#/components/schemas/AlertaResumen' } ]
          description: Presente solo si la lectura salio del umbral operativo

    PaginaLecturas:
      type: object
      required: [contenido, pagina, tamano, total]
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Lectura' }
        pagina: { type: integer, minimum: 0 }
        tamano: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }

    Alerta:
      type: object
      required: [id, lecturaId, sensorCodigo, variable, zona, zonaId, valor, unidad, nivel, mensaje, atendida, creadaEn]
      properties:
        id: { type: integer, format: int64 }
        lecturaId: { type: integer, format: int64 }
        sensorCodigo: { type: string }
        variable: { type: string }
        zonaId: { type: integer, format: int64 }
        zona: { type: string }
        valor: { type: number, description: Valor de la lectura que genero la alerta }
        unidad: { type: string }
        nivel: { type: string, enum: [BAJA, ALTA] }
        mensaje: { type: string }
        atendida: { type: boolean }
        atendidaEn: { type: string, format: date-time, description: Presente solo si atendida es true }
        atendidaPor:
          allOf: [ { $ref: '#/components/schemas/Rol' } ]
          description: Rol que la atendio; presente solo si atendida es true
        creadaEn: { type: string, format: date-time }

    PaginaAlertas:
      type: object
      required: [contenido, pagina, tamano, total]
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }
        pagina: { type: integer, minimum: 0 }
        tamano: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }

    CambioAtencion:
      type: object
      required: [atendida]
      properties:
        atendida: { type: boolean, description: "true: marcar como atendida; false: reabrir" }

    NuevaAnotacion:
      type: object
      required: [zonaId, texto]
      properties:
        zonaId: { type: integer, format: int64, minimum: 1 }
        lecturaId: { type: integer, format: int64, minimum: 1, description: Opcional; debe pertenecer a la zona }
        texto: { type: string, minLength: 3, maxLength: 300, description: Se recorta antes de validar el largo }

    Anotacion:
      type: object
      required: [id, zonaId, zona, autorRol, texto, creadaEn]
      properties:
        id: { type: integer, format: int64 }
        zonaId: { type: integer, format: int64 }
        zona: { type: string }
        lecturaId: { type: integer, format: int64, description: Presente solo si la anotacion refiere a una lectura }
        autorRol: { $ref: '#/components/schemas/Rol' }
        texto: { type: string, maxLength: 300 }
        creadaEn: { type: string, format: date-time }

    PaginaAnotaciones:
      type: object
      required: [contenido, pagina, tamano, total]
      properties:
        contenido:
          type: array
          items: { $ref: '#/components/schemas/Anotacion' }
        pagina: { type: integer, minimum: 0 }
        tamano: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }

    ErrorCampo:
      type: object
      required: [campo, mensaje]
      properties:
        campo: { type: string }
        mensaje: { type: string }

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          enum: [VALIDACION, NO_AUTENTICADO, ROL_SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, REGLA_DE_NEGOCIO, METODO_NO_PERMITIDO, BASE_NO_DISPONIBLE, ERROR_INTERNO]
        mensaje: { type: string }
        errores:
          type: array
          items: { $ref: '#/components/schemas/ErrorCampo' }
        instante: { type: string, format: date-time }
