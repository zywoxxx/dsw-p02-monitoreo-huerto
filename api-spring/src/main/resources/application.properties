# PR09 Monitoreo de huerto - API REST (P04)
# Todo lo sensible llega por variables de entorno; aqui no hay credenciales.
server.port=${PORT:8081}
spring.application.name=huerto-api

# PostgreSQL (misma base de P02/P03). Ejemplo: DB_URL=jdbc:postgresql://localhost:5436/huerto_db
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
# El esquema lo crean los scripts de sql/; Spring no lo toca
spring.sql.init.mode=never

# Seguridad basica: token firmado (HS256). Si JWT_SECRET no esta definido se genera uno al arrancar
huerto.jwt.secreto=${JWT_SECRET:}
huerto.jwt.minutos=30
# Origen permitido para el cliente Angular en desarrollo
huerto.cors.origen=${CORS_ORIGIN:http://localhost:4200}

# JSON: fechas ISO-8601, numeros decimales exactos (sin notacion cientifica)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-bigdecimal-as-plain=true
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.default-property-inclusion=non_null

# Errores: nunca exponer trazas al cliente
server.error.include-stacktrace=never
server.error.include-message=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# El aviso de arranque escribe el nombre del equipo y el usuario del sistema; se omite en los registros
spring.main.log-startup-info=false
