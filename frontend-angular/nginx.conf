# nginx como unica entrada del PR09 dentro de Docker:
#   /            -> estaticos del cliente Angular (rutas del SPA caen en index.html)
#   /api/        -> contenedor de la API (servicio "api" de docker-compose, puerto 8081)
#   /v3/api-docs, /swagger-ui* -> documentacion que publica springdoc en la API
# El navegador solo habla con nginx, asi que cliente y API quedan en el mismo origen.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass http://api:8081;
        proxy_set_header Host $host;
    }

    # Los archivos con hash del build pueden cachearse mucho tiempo; index.html no
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
