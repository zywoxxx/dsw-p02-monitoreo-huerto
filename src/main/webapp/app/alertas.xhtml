<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{alertaBean.preparar}"/>
        </f:metadata>
    </ui:define>
    <ui:define name="titulo">Alertas</ui:define>
    <ui:define name="contenido">
        <h:form id="formAlertas">
            <p:dataTable id="tablaAlertas" widgetVar="tablaAlertas" var="a"
                         value="#{alertaBean.alertas}" filteredValue="#{alertaBean.alertasFiltradas}"
                         paginator="true" rows="10" rowsPerPageTemplate="10,20,50" paginatorPosition="bottom"
                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                         currentPageReportTemplate="Alertas {startRecord}-{endRecord} de {totalRecords}"
                         sortMode="single" reflow="true" styleClass="tabla tarjeta"
                         emptyMessage="No hay alertas registradas: ninguna lectura ha salido del umbral operativo.">
                <f:facet name="header">
                    <div class="encabezado-tabla">
                        <span>Alertas generadas (RF06)</span>
                        <p:commandButton icon="pi pi-refresh" title="Actualizar" action="#{alertaBean.cargar}"
                                         update="tablaAlertas :mensajes" styleClass="ui-button-flat"/>
                    </div>
                </f:facet>
                <p:column headerText="#" sortBy="#{a.id}" width="70">#{a.id}</p:column>
                <p:column headerText="Lectura" width="90">##{a.lecturaId}</p:column>
                <p:column headerText="Sensor" filterBy="#{a.sensorCodigo}" filterMatchMode="contains"><code>#{a.sensorCodigo}</code></p:column>
                <p:column headerText="Zona" filterBy="#{a.zona}" filterMatchMode="contains">#{a.zona}</p:column>
                <p:column headerText="Valor" styleClass="num"><h:outputText value="#{a.valor}"/> #{a.unidad}</p:column>
                <p:column headerText="Nivel" filterBy="#{a.nivel}" filterMatchMode="exact" width="90">
                    <f:facet name="filter">
                        <p:selectOneMenu onchange="PF('tablaAlertas').filter()" styleClass="filtro">
                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItem itemLabel="ALTA" itemValue="ALTA"/>
                            <f:selectItem itemLabel="BAJA" itemValue="BAJA"/>
                        </p:selectOneMenu>
                    </f:facet>
                    <p:tag value="#{a.nivel}" severity="#{a.nivel eq 'ALTA' ? 'danger' : 'info'}"/>
                </p:column>
                <p:column headerText="Mensaje">#{a.mensaje}</p:column>
                <p:column headerText="Atendida" width="90">#{a.atendida ? 'Si' : 'No'}</p:column>
                <p:column headerText="Creada" sortBy="#{a.creadaEn}">#{a.creadaEnTexto}</p:column>
            </p:dataTable>
        </h:form>
        <p class="ayuda">La atencion o cierre de alertas no forma parte del alcance de P03; se listan tal como las genera el
            registro de lecturas.</p>
    </ui:define>
</ui:composition>
